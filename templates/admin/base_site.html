{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Memories Admin{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        <span style="font-size:1.4rem;">&#9829;</span> Memories Admin
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* =====================================================
   Custom Admin Theme — Warm Rose / Cream
   Matches the site's color palette
   ===================================================== */

    /* ---- Google Fonts ---- */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap');

    :root {
        --warm-bg: #fdf6f0;
        --warm-surface: #fff8f4;
        --warm-primary: #c0605a;
        --warm-primary-h: #a04e49;
        --warm-secondary: #e8a598;
        --warm-accent: #f2c4a0;
        --warm-text: #3d2b27;
        --warm-muted: #8c6a64;
        --warm-border: #e8c8bf;
        --warm-nav: #3d2b27;
        --warm-nav-h: #5a3f3a;
        --warm-success: #6a9e6a;
        --warm-danger: #c0605a;
        --font-serif: 'Playfair Display', Georgia, serif;
        --font-sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
        --radius: 8px;
        --shadow: 0 2px 12px rgba(61, 43, 39, 0.10);
        --shadow-lg: 0 8px 32px rgba(61, 43, 39, 0.15);
    }

    /* ---- Base ---- */
    html,
    body {
        background: var(--warm-bg) !important;
        font-family: var(--font-sans) !important;
        color: var(--warm-text) !important;
    }

    /* ---- Header / Branding bar ---- */
    #header {
        background: var(--warm-nav) !important;
        color: #fff !important;
        padding: 0 2rem !important;
        height: 60px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25) !important;
    }

    #site-name a {
        font-family: var(--font-serif) !important;
        font-size: 1.35rem !important;
        color: #fff !important;
        text-decoration: none !important;
        letter-spacing: 0.02em !important;
    }

    #site-name a:hover {
        color: var(--warm-accent) !important;
    }

    #user-tools {
        font-size: 0.82rem !important;
        color: rgba(255, 255, 255, 0.75) !important;
    }

    #user-tools a {
        color: var(--warm-accent) !important;
        margin-left: 0.75rem !important;
        text-decoration: none !important;
        font-weight: 500 !important;
    }

    #user-tools a:hover {
        color: #fff !important;
        text-decoration: underline !important;
    }

    /* ---- Breadcrumbs ---- */
    div.breadcrumbs {
        background: var(--warm-surface) !important;
        border-bottom: 1px solid var(--warm-border) !important;
        padding: 0.6rem 2rem !important;
        font-size: 0.83rem !important;
        color: var(--warm-muted) !important;
    }

    div.breadcrumbs a {
        color: var(--warm-primary) !important;
        text-decoration: none !important;
    }

    div.breadcrumbs a:hover {
        text-decoration: underline !important;
    }

    /* ---- Navigation sidebar ---- */
    #nav-sidebar {
        background: var(--warm-surface) !important;
        border-right: 1px solid var(--warm-border) !important;
        min-width: 220px !important;
    }

    .sticky {
        background: var(--warm-surface) !important;
    }

    /* Sidebar search */
    #nav-filter {
        border: 1.5px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.4rem 0.75rem !important;
        font-size: 0.85rem !important;
        background: var(--warm-bg) !important;
        color: var(--warm-text) !important;
        margin: 0.75rem !important;
        width: calc(100% - 1.5rem) !important;
        box-sizing: border-box !important;
    }

    #nav-filter:focus {
        outline: 2px solid var(--warm-secondary) !important;
        border-color: var(--warm-primary) !important;
    }

    /* App headings in sidebar */
    #nav-sidebar .module caption,
    #nav-sidebar .app-heading {
        background: var(--warm-nav) !important;
        color: #fff !important;
        font-family: var(--font-serif) !important;
        font-size: 0.78rem !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        padding: 0.45rem 1rem !important;
    }

    #nav-sidebar th a,
    #nav-sidebar td a {
        color: var(--warm-text) !important;
        font-size: 0.88rem !important;
        padding: 0.3rem 1rem !important;
        display: block !important;
        text-decoration: none !important;
        border-radius: 4px !important;
        margin: 1px 4px !important;
    }

    #nav-sidebar th a:hover,
    #nav-sidebar td a:hover {
        background: var(--warm-accent) !important;
        color: var(--warm-text) !important;
    }

    /* ---- Main content area ---- */
    #content {
        background: var(--warm-bg) !important;
        padding: 1.5rem 2rem !important;
    }

    #content h1 {
        font-family: var(--font-serif) !important;
        color: var(--warm-primary) !important;
        font-size: 1.6rem !important;
        margin-bottom: 1.25rem !important;
        font-weight: 600 !important;
    }

    /* ---- Dashboard modules ---- */
    .dashboard #content-main .module {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        box-shadow: var(--shadow) !important;
        overflow: hidden !important;
        margin-bottom: 1.5rem !important;
    }

    .module caption,
    .module h2,
    .module .section-title {
        background: linear-gradient(135deg, var(--warm-primary) 0%, var(--warm-primary-h) 100%) !important;
        color: #fff !important;
        font-family: var(--font-serif) !important;
        font-size: 0.9rem !important;
        font-weight: 600 !important;
        letter-spacing: 0.03em !important;
        padding: 0.65rem 1.1rem !important;
    }

    .module table {
        width: 100% !important;
        border-collapse: collapse !important;
    }

    .module th,
    .module td {
        padding: 0.55rem 1rem !important;
        border-bottom: 1px solid var(--warm-border) !important;
        font-size: 0.875rem !important;
    }

    .module th {
        background: rgba(192, 96, 90, 0.06) !important;
        font-weight: 600 !important;
        color: var(--warm-text) !important;
    }

    .module tr:hover td {
        background: rgba(242, 196, 160, 0.18) !important;
    }

    .module a {
        color: var(--warm-primary) !important;
        text-decoration: none !important;
        font-weight: 500 !important;
    }

    .module a:hover {
        color: var(--warm-primary-h) !important;
        text-decoration: underline !important;
    }

    /* ---- Changelist table ---- */
    #result_list {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        box-shadow: var(--shadow) !important;
        overflow: hidden !important;
        border-collapse: separate !important;
        border-spacing: 0 !important;
        width: 100% !important;
    }

    #result_list thead th {
        background: linear-gradient(135deg, var(--warm-primary) 0%, var(--warm-primary-h) 100%) !important;
        color: #fff !important;
        font-family: var(--font-sans) !important;
        font-size: 0.8rem !important;
        font-weight: 600 !important;
        letter-spacing: 0.05em !important;
        text-transform: uppercase !important;
        padding: 0.7rem 1rem !important;
        border: none !important;
    }

    #result_list thead th a {
        color: #fff !important;
        text-decoration: none !important;
    }

    #result_list thead th.sorted a {
        color: var(--warm-accent) !important;
    }

    #result_list tbody tr {
        border-bottom: 1px solid var(--warm-border) !important;
        transition: background 0.15s ease !important;
    }

    #result_list tbody tr:hover td {
        background: rgba(242, 196, 160, 0.22) !important;
    }

    #result_list tbody tr.selected td {
        background: rgba(192, 96, 90, 0.08) !important;
    }

    #result_list td {
        padding: 0.6rem 1rem !important;
        font-size: 0.875rem !important;
        color: var(--warm-text) !important;
        border: none !important;
        vertical-align: middle !important;
    }

    #result_list td a {
        color: var(--warm-primary) !important;
        font-weight: 500 !important;
        text-decoration: none !important;
    }

    #result_list td a:hover {
        text-decoration: underline !important;
    }

    /* Checkbox column */
    #result_list td.action-checkbox,
    #result_list th.action-checkbox-column {
        width: 36px !important;
        text-align: center !important;
    }

    /* ---- Pagination ---- */
    .paginator {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.5rem 1rem !important;
        font-size: 0.85rem !important;
        color: var(--warm-muted) !important;
        margin-top: 0.5rem !important;
    }

    .paginator a {
        color: var(--warm-primary) !important;
        padding: 0.2rem 0.5rem !important;
        border-radius: 4px !important;
        text-decoration: none !important;
    }

    .paginator a:hover {
        background: var(--warm-accent) !important;
    }

    .paginator .this-page {
        background: var(--warm-primary) !important;
        color: #fff !important;
        padding: 0.2rem 0.6rem !important;
        border-radius: 4px !important;
    }

    /* ---- Action bar ---- */
    .actions {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.5rem 1rem !important;
        margin-bottom: 0.75rem !important;
        display: flex !important;
        align-items: center !important;
        gap: 0.75rem !important;
        flex-wrap: wrap !important;
    }

    .actions select {
        border: 1.5px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.35rem 0.6rem !important;
        font-size: 0.85rem !important;
        background: var(--warm-bg) !important;
        color: var(--warm-text) !important;
    }

    /* ---- Buttons ---- */
    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        background: var(--warm-primary) !important;
        color: #fff !important;
        border: none !important;
        border-radius: var(--radius) !important;
        padding: 0.5rem 1.25rem !important;
        font-family: var(--font-sans) !important;
        font-size: 0.88rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        text-decoration: none !important;
        transition: background 0.2s ease, transform 0.1s ease !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.35rem !important;
    }

    .button:hover,
    input[type=submit]:hover,
    .submit-row input:hover,
    a.button:hover {
        background: var(--warm-primary-h) !important;
        transform: translateY(-1px) !important;
        color: #fff !important;
    }

    .button.default,
    input[type=submit].default {
        background: var(--warm-primary) !important;
        box-shadow: 0 2px 8px rgba(192, 96, 90, 0.35) !important;
    }

    /* Delete button */
    .deletelink,
    a.deletelink {
        background: #b94040 !important;
        color: #fff !important;
        border-radius: var(--radius) !important;
        padding: 0.4rem 1rem !important;
        font-size: 0.85rem !important;
        font-weight: 600 !important;
        text-decoration: none !important;
    }

    .deletelink:hover {
        background: #963030 !important;
    }

    /* Add button (top right) */
    .object-tools a.addlink {
        background: var(--warm-primary) !important;
        color: #fff !important;
        border-radius: var(--radius) !important;
        padding: 0.45rem 1.1rem !important;
        font-weight: 600 !important;
        font-size: 0.88rem !important;
        text-decoration: none !important;
        box-shadow: 0 2px 8px rgba(192, 96, 90, 0.3) !important;
    }

    .object-tools a.addlink:hover {
        background: var(--warm-primary-h) !important;
    }

    /* ---- Submit row ---- */
    .submit-row {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 1rem 1.25rem !important;
        display: flex !important;
        gap: 0.75rem !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        margin-top: 1.5rem !important;
        box-shadow: var(--shadow) !important;
    }

    /* ---- Forms / Fieldsets ---- */
    fieldset {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 1.25rem !important;
        margin-bottom: 1.25rem !important;
        box-shadow: var(--shadow) !important;
    }

    fieldset h2 {
        font-family: var(--font-serif) !important;
        color: #fff !important;
        background: linear-gradient(135deg, var(--warm-primary) 0%, var(--warm-primary-h) 100%) !important;
        margin: -1.25rem -1.25rem 1rem -1.25rem !important;
        padding: 0.65rem 1.25rem !important;
        border-radius: var(--radius) var(--radius) 0 0 !important;
        font-size: 0.95rem !important;
        font-weight: 600 !important;
    }

    .form-row {
        padding: 0.6rem 0 !important;
        border-bottom: 1px solid rgba(232, 200, 191, 0.4) !important;
    }

    .form-row:last-child {
        border-bottom: none !important;
    }

    label {
        font-weight: 600 !important;
        font-size: 0.85rem !important;
        color: var(--warm-text) !important;
    }

    input[type=text],
    input[type=password],
    input[type=number],
    input[type=email],
    input[type=url],
    input[type=date],
    select,
    textarea {
        border: 1.5px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.45rem 0.75rem !important;
        font-size: 0.875rem !important;
        background: var(--warm-bg) !important;
        color: var(--warm-text) !important;
        font-family: var(--font-sans) !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none !important;
        border-color: var(--warm-primary) !important;
        box-shadow: 0 0 0 3px rgba(192, 96, 90, 0.18) !important;
    }

    /* File input */
    .file-upload p {
        font-size: 0.85rem !important;
        color: var(--warm-muted) !important;
    }

    /* ---- Filter sidebar ---- */
    #changelist-filter {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        box-shadow: var(--shadow) !important;
        overflow: hidden !important;
        min-width: 160px !important;
    }

    #changelist-filter h2 {
        background: linear-gradient(135deg, var(--warm-primary) 0%, var(--warm-primary-h) 100%) !important;
        color: #fff !important;
        font-family: var(--font-serif) !important;
        font-size: 0.85rem !important;
        font-weight: 600 !important;
        padding: 0.6rem 1rem !important;
        margin: 0 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
    }

    #changelist-filter h3 {
        font-size: 0.78rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        color: var(--warm-muted) !important;
        padding: 0.5rem 1rem 0.25rem !important;
        margin: 0 !important;
        font-weight: 600 !important;
    }

    #changelist-filter ul {
        padding: 0 0 0.5rem 0 !important;
        margin: 0 !important;
        list-style: none !important;
    }

    #changelist-filter li {
        padding: 0 !important;
    }

    #changelist-filter li a {
        display: block !important;
        padding: 0.3rem 1rem !important;
        color: var(--warm-text) !important;
        font-size: 0.85rem !important;
        text-decoration: none !important;
        transition: background 0.15s !important;
    }

    #changelist-filter li a:hover {
        background: var(--warm-accent) !important;
        color: var(--warm-text) !important;
    }

    #changelist-filter li.selected a {
        color: var(--warm-primary) !important;
        font-weight: 600 !important;
        background: rgba(192, 96, 90, 0.08) !important;
    }

    /* ---- Messages ---- */
    .messagelist {
        padding: 0 !important;
        list-style: none !important;
        margin-bottom: 1rem !important;
    }

    .messagelist li {
        padding: 0.7rem 1.1rem !important;
        border-radius: var(--radius) !important;
        font-size: 0.875rem !important;
        font-weight: 500 !important;
        margin-bottom: 0.5rem !important;
    }

    .messagelist li.success {
        background: rgba(106, 158, 106, 0.15) !important;
        border: 1px solid #6a9e6a !important;
        color: #3a6e3a !important;
    }

    .messagelist li.warning {
        background: rgba(242, 196, 160, 0.3) !important;
        border: 1px solid var(--warm-accent) !important;
        color: #7a5030 !important;
    }

    .messagelist li.error {
        background: rgba(192, 96, 90, 0.12) !important;
        border: 1px solid var(--warm-primary) !important;
        color: var(--warm-primary-h) !important;
    }

    /* ---- Search bar ---- */
    #searchbar {
        border: 1.5px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        padding: 0.45rem 0.75rem !important;
        font-size: 0.875rem !important;
        background: var(--warm-bg) !important;
        color: var(--warm-text) !important;
    }

    #searchbar:focus {
        border-color: var(--warm-primary) !important;
        box-shadow: 0 0 0 3px rgba(192, 96, 90, 0.18) !important;
        outline: none !important;
    }

    #search-bar-submit,
    input[name="_search"] {
        background: var(--warm-primary) !important;
        color: #fff !important;
        border: none !important;
        border-radius: var(--radius) !important;
        padding: 0.45rem 0.9rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
    }

    /* ---- Object tools (top right buttons) ---- */
    .object-tools {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 0 1rem 0 !important;
        display: flex !important;
        gap: 0.5rem !important;
        justify-content: flex-end !important;
    }

    /* ---- Inline tabular ---- */
    .inline-group {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        overflow: hidden !important;
        margin-bottom: 1.25rem !important;
    }

    .inline-group h2 {
        background: linear-gradient(135deg, var(--warm-primary) 0%, var(--warm-primary-h) 100%) !important;
        color: #fff !important;
        padding: 0.6rem 1rem !important;
        font-size: 0.88rem !important;
        font-weight: 600 !important;
        margin: 0 !important;
    }

    /* ---- Login page ---- */
    body.login {
        background: var(--warm-bg) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 100vh !important;
    }

    body.login #header {
        display: none !important;
    }

    body.login #content-main {
        background: var(--warm-surface) !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: 16px !important;
        box-shadow: var(--shadow-lg) !important;
        padding: 2.5rem 2rem !important;
        min-width: 340px !important;
        max-width: 400px !important;
        width: 100% !important;
    }

    body.login h1 {
        font-family: var(--font-serif) !important;
        color: var(--warm-primary) !important;
        text-align: center !important;
        font-size: 1.6rem !important;
        margin-bottom: 0.25rem !important;
    }

    body.login h1 a {
        color: var(--warm-primary) !important;
        text-decoration: none !important;
    }

    /* ---- Misc ---- */
    .help,
    p.help {
        font-size: 0.8rem !important;
        color: var(--warm-muted) !important;
        font-style: italic !important;
        margin-top: 0.25rem !important;
    }

    a:focus-visible {
        outline: 2px solid var(--warm-secondary) !important;
        outline-offset: 2px !important;
        border-radius: 3px !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
    }

    ::-webkit-scrollbar-track {
        background: var(--warm-bg);
    }

    ::-webkit-scrollbar-thumb {
        background: var(--warm-border);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--warm-secondary);
    }

    /* ---- Responsive ---- */
    @media (max-width: 767px) {
        #content {
            padding: 1rem !important;
        }

        #header {
            padding: 0 1rem !important;
        }
    }

    /* ---- Date/Time Calendar Widget Fix ---- */
    .calendarbox,
    .clockbox {
        background: #fff !important;
        border: 1px solid var(--warm-border) !important;
        border-radius: var(--radius) !important;
        box-shadow: 0 8px 24px rgba(61, 43, 39, 0.18) !important;
        z-index: 9999 !important;
        overflow: visible !important;
        position: absolute !important;
        min-width: 260px !important;
    }

    .calendarbox h2,
    .calendar caption {
        background: linear-gradient(135deg, var(--warm-primary), var(--warm-primary-h)) !important;
        color: #fff !important;
        padding: 0.5rem 0.75rem !important;
        font-size: 0.9rem !important;
        font-weight: 600 !important;
        text-align: center !important;
        border-radius: var(--radius) var(--radius) 0 0 !important;
    }

    .calendar table {
        width: 100% !important;
        border-collapse: collapse !important;
    }

    .calendar th {
        background: rgba(192, 96, 90, 0.08) !important;
        color: var(--warm-primary) !important;
        font-weight: 700 !important;
        font-size: 0.78rem !important;
        padding: 0.4rem !important;
        text-align: center !important;
    }

    .calendar td {
        padding: 0.25rem !important;
        text-align: center !important;
        border: none !important;
    }

    .calendar td a {
        display: inline-block !important;
        width: 28px !important;
        height: 28px !important;
        line-height: 28px !important;
        border-radius: 50% !important;
        color: var(--warm-text) !important;
        text-decoration: none !important;
        font-size: 0.85rem !important;
        transition: background 0.15s !important;
    }

    .calendar td a:hover {
        background: var(--warm-accent) !important;
        color: var(--warm-text) !important;
    }

    .calendar td.selected a {
        background: var(--warm-primary) !important;
        color: #fff !important;
    }
