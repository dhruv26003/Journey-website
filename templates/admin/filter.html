{% load i18n %}
<div class="saas-filter-group" data-filter-title="{{ title }}">
    <div class="filter-group-header">
        <span class="filter-label-icon"><i class="fas fa-layer-group"></i></span>
        <span class="filter-label-text">By {{ title }}</span>
    </div>
    <div class="filter-chips-list">
        {% for choice in choices %}
        <a href="{{ choice.query_string|iriencode }}" class="filter-chip {% if choice.selected %}active{% endif %}">
            {% if choice.display == 'All' %}
                <i class="fas fa-border-all"></i>
            {% elif choice.display|lower == 'photo' %}
                <i class="fas fa-camera"></i>
            {% elif choice.display|lower == 'video' %}
                <i class="fas fa-video"></i>
            {% endif %}
            <span>{{ choice.display }}</span>
        </a>
        {% endfor %}
    </div>
</div>
